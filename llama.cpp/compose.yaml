name: dgx-llamacpp

services:
  llamacpp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_COMMIT: 1464c62d88f699ec9700c8010bbfdbc603a9efd6
    image: mazi/llama.cpp:b10236-cuda13-openssl
    platform: linux/arm64
    container_name: dgx-llamacpp
    entrypoint:
      - /bin/bash
      - /config/launch.sh
    command:
      - ${LLAMA_PROFILE:?LLAMA_PROFILE is required}
    init: true
    ipc: host
    gpus: all
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - "${HOME:?HOME is required}/models/gguf:/models:ro"
      - ./launch.sh:/config/launch.sh:ro
      - ./profiles:/config/profiles:ro
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 6s
      start_period: 10m
      retries: 6
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
