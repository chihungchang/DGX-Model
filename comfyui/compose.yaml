services:
  comfyui:
    build:
      context: .
      args:
        COMFYUI_COMMIT: 34d0629452cac83dc20aa3d84e45c9b60d9e36b3
    image: mazi/comfyui:0.28.3-cu130-arm64
    container_name: mazi-comfyui
    restart: unless-stopped
    gpus: all
    shm_size: 16gb
    stop_signal: SIGINT
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    ports:
      - "8188:8188"
    environment:
      HF_HOME: /data/cache/huggingface
      TORCH_HOME: /data/cache/torch
      PYTORCH_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
