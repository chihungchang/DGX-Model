name: dgx-tensorfold-tp2
services:
  tensorfold:
    image: dgx-tensorfold:deepseek-v41-07aa02585f64-pool-v2-dsml-v1-images-v1-output-ceiling-v1
    pull_policy: never
    platform: linux/arm64
    container_name: dgx-tensorfold-tp2-r${TENSORFOLD_RANK:?Set TENSORFOLD_RANK}
    entrypoint: [/bin/bash, /config/launch-native.sh]
    command: ["${TENSORFOLD_PROFILE:?Set TENSORFOLD_PROFILE}"]
    init: true
    ipc: host
    network_mode: host
    gpus: all
    cpuset: 5-9,15-19
    restart: "no"
    mem_limit: 112g
    memswap_limit: 112g
    mem_swappiness: 0
    oom_score_adj: 1000
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: {soft: -1, hard: -1}
      stack: {soft: 67108864, hard: 67108864}
    environment:
      TENSORFOLD_RANK: "${TENSORFOLD_RANK}"
      TF_TP_WORLD: "2"
      TF_TP_MASTER: 192.168.100.10
      TF_TP_PORT: "29551"
      TF_DS_WINDOW: "1245184"
      TF_DS_STREAMS: "4"
      TF_DS_ROUND_ROWS: "16"
      TF_FILL_CHUNKS: "1"
      TF_FILL_ROUNDS: "4096"
      TF_DS_REPLAY_FLOOR: "1"
      TF_DS_GRAPHS: "1"
      TF_DS_HC_SIDE: "1"
      TF_DS_L2_PREFETCH: "1"
      TF_DS_ENGRAM_AIO: "1"
      TF_DS_IDX_SPLIT: "1"
      TF_DS_PROMPT_ALIAS: "1"
      TF_DS_VISION_URLS: "1"
      TF_DS_RANK_CACHE: /cache/tf-ds-rank
      TF_DS_KIT: /kit
      TF_DS_RDMA_KERNELS: /native/rdma_gather.fatbin
      TF_DS_ENGRAM: /engram
      TF_DS_TOKEN_MAP: /cache/dsv41-token-map.json
      TF_RDMA_DEVICES: rocep1s0f0,roceP2p1s0f0
      TF_RDMA_GID_INDEX: "3"
      NCCL_IB_HCA: rocep1s0f0,roceP2p1s0f0
      NCCL_IB_GID_INDEX: "3"
      NCCL_SOCKET_IFNAME: enp1s0f0np0
      TENSORFOLD_GRAMMAR_LIB: /kit/grammar/libtfgrammar.so
      TENSORFOLD_SSE_KEEPALIVE: "15"
      TENSORFOLD_CUDA_KERNELS: /kit/aot
      TENSORFOLD_MEMORY_RESERVE_GIB: "5"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${TENSORFOLD_MODEL_VIEW:?Set TENSORFOLD_MODEL_VIEW}/model:/model:ro
      - ${TENSORFOLD_MODEL_VIEW}/engram:/engram:ro
      - ${TENSORFOLD_CACHE_DIR:?Set TENSORFOLD_CACHE_DIR}:/cache:ro
      - ./native/runtime:/native:ro
      - ./native/runtime/kit:/kit:ro
      - ./native/runtime/chat_template.native.jinja:/model/chat_template.jinja:ro
      - ./launch-native.sh:/config/launch-native.sh:ro
      - ./profiles:/config/profiles:ro
    labels:
      ai.dgx.engine: tensorfold
      ai.dgx.profile: "${TENSORFOLD_PROFILE}"
      ai.dgx.runtime: native
      ai.dgx.tensorfold.revision: a57deb9d470b27e1e3fab2a9494915a0049415aa
      ai.dgx.cluster: tp2
    stop_grace_period: 2m
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
